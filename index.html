<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d11">
  <meta name="robots" content="noindex">
  <title>Pubquiz Huisweekend</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="who" id="who"></div>
    <div class="where" id="where"></div>
    <div class="timer" id="timer" hidden></div>
  </header>
  <div class="banner" id="offline" hidden>Geen verbinding. Even geduld…</div>

  <main id="view">
    <div class="status"><div class="icon">🍺</div><h1>Laden…</h1></div>
  </main>

  <dialog id="confirm">
    <h2 id="confirmTitle"></h2>
    <div id="confirmBody"></div>
    <div class="row">
      <button class="btn primary" id="confirmOk" type="button"></button>
      <button class="btn" id="confirmCancel" type="button">Terug</button>
    </div>
  </dialog>

  <noscript>Zet JavaScript aan om mee te doen.</noscript>
  <script type="module" src="js/player.js"></script>
</body>
</html>
